name: Go

on:
  push:
    branches: [master, v1]
  pull_request:
    branches: [master, v1]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -v -race ./...
      - run: go vet ./...
