version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    staticcheck:
      # Quick-fix style suggestions are noise for this codebase; keep
      # only correctness/perf checks.
      checks:
        - "all"
        - "-QF*"
  exclusions:
    paths:
      - upstream
      - data
